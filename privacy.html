    function changeLanguage(lang) {
      const doc = legalDocs[lang] || legalDocs["en"];
      document.getElementById("legalContent").innerHTML = doc;
      document.documentElement.lang = lang;
      localStorage.setItem("luxevault_lang", lang);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("luxevault_lang");
      if (saved && legalDocs[saved]) {
        document.getElementById("langSelector").value = saved;
        changeLanguage(saved);
      } else {
        const browser = navigator.language || navigator.userLanguage;
        if (browser.startsWith("zh-TW") || browser.startsWith("zh-HK")) changeLanguage("zh-Hant");
        else if (browser.startsWith("zh")) changeLanguage("zh-Hans");
        else if (browser.startsWith("ja")) changeLanguage("ja");
        else if (browser.startsWith("fr")) changeLanguage("fr");
        else changeLanguage("en");
      }
    });
